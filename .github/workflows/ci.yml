name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24 avec cache npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lint (aucun avertissement toléré)
        run: npm run lint -- --max-warnings=0

      - name: Tests
        run: npm test

      - name: Couverture du calcul des devis (80 % lignes et branches)
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='src/devis/**'
          --test-coverage-lines=80
          --test-coverage-branches=80

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout avec tout l'historique
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installation de gitleaks 8.30.1
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar xz -C /usr/local/bin gitleaks

      - name: Recherche de secrets dans l'historique de la branche
        run: gitleaks git -v --no-banner --redact --log-opts="HEAD" .
